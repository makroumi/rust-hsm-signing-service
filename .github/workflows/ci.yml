name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    runs-on: ubuntu-latest
    env:
      SOFTHSM2_CONF: /tmp/softhsm/softhsm2.conf
      PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
      PKCS11_SLOT: "0"
      PKCS11_PIN: "1234"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install and initialize SoftHSM2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq softhsm2
          mkdir -p /tmp/softhsm/tokens
          printf 'directories.tokendir = /tmp/softhsm/tokens\nobjectstore.backend = file\nlog.level = INFO\n' > /tmp/softhsm/softhsm2.conf
          softhsm2-util --init-token --slot 0 --label "test" --so-pin 1234 --pin 1234

      - name: Provision test keys
        run: bash scripts/provision-keys.sh || true

      - run: cargo test --workspace --all-targets

  bench-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run

[workspace]
resolver = "2"
members = [
    "crates/hsm-core",
    "crates/hsm-pkcs11",
    "crates/hsm-mock",
    "crates/signing-service",
    "crates/load-test",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Makroumi <https://github.com/makroumi>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/makroumi/rust-hsm-signing-service"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# HTTP
axum = { version = "0.7", features = ["macros", "tracing"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit", "cors", "request-id", "util"] }
hyper = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.27"
opentelemetry = "0.26"
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.26", features = ["grpc-tonic"] }

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Config
config = "0.14"
dotenvy = "0.15"

# PKCS#11
cryptoki = "0.7"

# Crypto (verify side & helpers)
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

# Testing
mockall = "0.13"
rstest = "0.23"
assert_matches = "1.5"
proptest = "1.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tempfile = "3"
once_cell = "1"

# Benchmarks / load
hdrhistogram = "7"
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
debug = false
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = true
strip = false

# ── cargo-deny configuration ──────────────────────────────────────────
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # crypto-bigint 0.5.x - no backported patch. p256 0.13 → elliptic-curve
    # 0.13 → crypto-bigint 0.5.  Upgrade path: p256 0.14 (not yet released).
    # Mitigation: private-key arithmetic runs inside the HSM, not in
    # software big-int code.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 unpatched; p256 0.13 pins it. HSM-backed keys mitigate." },

    # cryptoki 0.7 → 0.12 is a breaking API migration.  The OOB read
    # requires a crafted CKA_ALLOWED_MECHANISMS from HSM firmware - not
    # attacker-controllable in our threat model.
    { id = "RUSTSEC-2026-0286", reason = "cryptoki 0.7→0.12 breaking migration pending. OOB requires malicious HSM firmware." },

    # paste is archived but functionally complete and zero-dependency.
    # Transitive via cryptoki 0.7; resolves with the cryptoki upgrade.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained but stable; transitive via cryptoki 0.7." },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

# ring bundles BoringSSL under a custom OpenSSL-like license.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# windows-sys 0.52 (ring → rustls) vs 0.61 (tokio, clap) - transitive,
# unresolvable without upstream coordination.
skip = [
    { name = "windows-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
